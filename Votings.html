<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102544">
  <title>Award Voting System</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Award Voting System home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>Award Voting System</span>
      </a>
      <div id="public-status" class="status-pill">Checking voting status</div>
    </header>
    <main id="main-content" class="main-content" aria-live="polite">
      <div class="loading-panel">Loading voting system…</div>
    </main>
    <footer class="site-footer">A secure and fair vote, counted with care.</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog" class="dialog-card">
      <span class="eyebrow">CONFIRM YOUR BALLOT</span>
      <h2 id="confirm-title">Submit your vote?</h2>
      <p id="confirm-copy"></p>
      <div class="dialog-actions">
        <button class="button button-secondary" value="cancel">Go back</button>
        <button id="confirm-submit" class="button button-primary" value="confirm">Confirm vote</button>
      </div>
    </form>
  </dialog>
</body>
</html>
